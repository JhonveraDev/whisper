<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Translation Prototype</title>
  </head>
  <body>
    <h1>Voice Translation Prototype</h1>

    <label>
      Input language
      <select id="inputLanguage">
        <option value="English">English</option>
        <option value="Spanish">Spanish</option>
      </select>
    </label>

    <label>
      Output language
      <select id="outputLanguage">
        <option value="Spanish">Spanish</option>
        <option value="English">English</option>
      </select>
    </label>

    <button id="startButton">Start</button>
    <button id="stopButton" disabled>Stop</button>

    <p>Status: <span id="status">stopped</span></p>
    <p>Use headphones to avoid the translated audio feeding back into the microphone.</p>

    <script src="/app.js"></script>
  </body>
</html>
